
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shopping App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h2>🛍️ MyShop</h2>

    <nav>
        <a href="#home">Home</a>
        <a href="#products">Products</a>
        <a href="#tracking">Track Order</a>
    </nav>

    <div class="header-actions">
        <button onclick="showCart()">🛒 Cart (<span id="cartCount">0</span>)</button>
        <button onclick="showLogin()">Login</button>
    </div>
</header>

<section class="hero" id="home">
    <h1>Welcome to MyShop</h1>
    <p>Discover amazing products at the best prices.</p>
    <button onclick="scrollProducts()">Shop Now</button>
</section>

<section class="container" id="products">
    <h2>Our Products</h2>

    <input
        type="text"
        id="search"
        placeholder="Search products..."
        oninput="displayProducts()"
    >

    <div class="products" id="productList"></div>
</section>

<section class="container" id="tracking">
    <h2>Track Your Order</h2>
    <input type="text" id="orderId" placeholder="Enter Order ID">
    <button onclick="trackOrder()">Track Order</button>
    <div id="trackingResult"></div>
</section>

<!-- Product Details -->
<div class="modal" id="productModal">
    <div class="modal-content">
        <button class="close" onclick="closeModal('productModal')">✖</button>
        <div id="productDetails"></div>
    </div>
</div>

<!-- Shopping Cart -->
<div class="modal" id="cartModal">
    <div class="modal-content">
        <button class="close" onclick="closeModal('cartModal')">✖</button>
        <h2>Shopping Cart</h2>
        <div id="cartItems"></div>
        <h3>Total: ₹<span id="cartTotal">0</span></h3>
        <button onclick="checkout()">Proceed to Payment</button>
    </div>
</div>

<!-- Login -->
<div class="modal" id="loginModal">
    <div class="modal-content">
        <button class="close" onclick="closeModal('loginModal')">✖</button>
        <h2>User Login</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <p id="loginMessage"></p>
    </div>
</div>

<!-- Payment -->
<div class="modal" id="paymentModal">
    <div class="modal-content">
        <button class="close" onclick="closeModal('paymentModal')">✖</button>
        <h2>Checkout</h2>
        <p>Total Amount: ₹<span id="paymentTotal">0</span></p>

        <input id="customerName" placeholder="Full Name">
        <input id="address" placeholder="Delivery Address">

        <select id="paymentMethod">
            <option value="UPI">UPI</option>
            <option value="Card">Credit / Debit Card</option>
            <option value="COD">Cash on Delivery</option>
        </select>

        <button onclick="placeOrder()">Place Order</button>
    </div>
</div>

<footer>
    <p>© 2026 MyShop. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
